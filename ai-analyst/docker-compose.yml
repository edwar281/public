# Three containers on one Oracle Cloud Always Free VM:
#   caddy  - public HTTPS (automatic Let's Encrypt certificate), forwards to api
#   api    - FastAPI: talks to Gemini, streams steps to the browser, serves the page
#   runner - executes AI-written SQL/Python; on an internal network with no internet access
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
    depends_on: [api]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_URL: http://runner:8001
    volumes:
      - cache:/cache
    networks: [edge, sandbox]
    depends_on: [runner]
    mem_limit: 512m

  runner:
    build: { context: ., dockerfile: runner/Dockerfile }
    restart: unless-stopped
    networks: [sandbox]          # internal only: no route to the internet
    init: true               # tini reaps stray processes
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    environment:
      RUN_TIMEOUT_SECONDS: "30"
      RUN_MEMORY_MB: "1536"

networks:
  edge: {}
  sandbox:
    internal: true

volumes:
  caddy_data: {}
  cache: {}
